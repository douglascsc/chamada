<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>RoboSapiens 2026 — Estoura Balões</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <img src="assets/robosapiens.png" class="logo robo" alt="RoboSapiens">
      <div class="brand-divider"></div>
      <img src="assets/ifsul.svg" class="logo ifsul" alt="IFSul Campus Sapiranga">
    </div>
    <div class="event-badge">
      <span>ROBOSAPIENS 2026</span>
      <strong>Robô Estoura Balão</strong>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnFullscreen" title="Tela cheia">⛶</button>
      <button class="icon-btn" id="btnTelao" title="Abrir telão em nova janela">📺</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav>
        <button class="nav-btn active" data-view="inicio">🏠 <span>Início</span></button>
        <button class="nav-btn" data-view="equipes">👥 <span>Equipes</span></button>
        <button class="nav-btn" data-view="cores">🎨 <span>Cores</span></button>
        <button class="nav-btn nav-arena" data-view="arena">🎈 <span>Arena Livre</span></button>
        <button class="nav-btn nav-cup" data-view="confrontos">⚔️ <span>Confrontos</span></button>
        <button class="nav-btn" data-view="telao">📺 <span>Telão</span></button>
        <button class="nav-btn" data-view="config">⚙️ <span>Config.</span></button>
      </nav>
      <div class="sidebar-foot">RoboSapiens · IFSul<br>Campus Sapiranga</div>
    </aside>

    <main id="main" class="main"></main>
  </div>
</div>

<div id="tvFull" class="tv-full hidden"></div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div id="modalContent"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
